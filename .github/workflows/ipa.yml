name: Build IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild iOS project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios

      - name: Build unsigned app
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c "import json,sys; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: apps/mobile/ios
        run: |
          echo "cwd=$(pwd)"
          echo '--- DerivedData contents:'
          ls -la DerivedData 2>/dev/null || echo 'no DerivedData here'
          ls -la DerivedData/Build/Products 2>/dev/null || echo 'no Products dir'
          APP=$(find DerivedData -type d -name '*.app' 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo '--- fallback workspace-wide search:'
            APP=$(find . -type d -name '*.app' 2>/dev/null | head -1)
          fi
          echo "app bundle: $APP"
          test -n "$APP"
          rm -rf Payload OpenMuse.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry OpenMuse.ipa Payload
          ls -lh OpenMuse.ipa
          unzip -l OpenMuse.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmuse-ipa
          path: apps/mobile/ios/OpenMuse.ipa
          if-no-files-found: error
          retention-days: 7
