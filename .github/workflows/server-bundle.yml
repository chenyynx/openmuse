name: Server Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Install root dependencies only
        run: pnpm install --frozen-lockfile --filter openmuse

      - name: Build server
        run: pnpm build:server

      - name: Pack bundle
        run: |
          tar -czf openmuse-server.tgz dist node_modules package.json
          ls -lh openmuse-server.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: openmuse-server-bundle
          path: openmuse-server.tgz
          if-no-files-found: error
          retention-days: 3
